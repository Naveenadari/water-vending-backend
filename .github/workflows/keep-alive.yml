name: Keep Backend Awake

on:
  schedule:
    # Runs every 10 minutes (GitHub may add a few minutes of delay under load,
    # but this stays comfortably inside Render's 15-minute idle timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sS -o /dev/null -w "Status: %{http_code}\n" https://water-vending-backend.onrender.com
